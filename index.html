<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreatorAI Studio | Elite Content Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0f172a;
            --secondary: #1e293b;
            --accent: #3b82f6;
            --accent-light: #60a5fa;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1a1f35 50%, #0f172a 100%);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Fundo Mesh Gradient Premium */
        .mesh-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: 
                radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 0%, rgba(34, 197, 94, 0.1) 0%, transparent 50%);
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% {
                background: 
                    radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                    radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                    radial-gradient(circle at 40% 0%, rgba(34, 197, 94, 0.1) 0%, transparent 50%);
            }
            50% {
                background: 
                    radial-gradient(circle at 80% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                    radial-gradient(circle at 20% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                    radial-gradient(circle at 60% 100%, rgba(34, 197, 94, 0.1) 0%, transparent 50%);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            min-height: 100vh;
            align-items: center;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 15px 20px;
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            border-radius: 20px;
            font-size: 12px;
            color: var(--success);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .container {
            margin-top: 80px;
        }

        /* Panel Esquerdo */
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel-section {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
        }

        .panel-section:hover {
            border-color: var(--accent);
            background: rgba(30, 41, 59, 0.8);
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 3px;
            height: 16px;
            background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
            border-radius: 2px;
        }

        /* Textarea */
        textarea {
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
            transition: all 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        textarea::placeholder {
            color: var(--text-secondary);
        }

        /* Selects */
        select {
            width: 100%;
            padding: 10px 12px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select:hover {
            border-color: var(--accent);
        }

        select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        select option {
            background: var(--secondary);
            color: var(--text-primary);
        }

        /* Buttons */
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
            color: white;
            width: 100%;
            grid-column: 1 / -1;
            padding: 14px;
            font-size: 15px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .btn-secondary:hover {
            background: rgba(59, 130, 246, 0.2);
        }

        .btn-surprise {
            background: rgba(139, 92, 246, 0.1);
            color: #a78bfa;
            border: 1px solid #a78bfa;
            width: 100%;
        }

        .btn-surprise:hover {
            background: rgba(139, 92, 246, 0.2);
        }

        /* Preview Panel */
        .preview-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .preview-container {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .preview-content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(139, 92, 246, 0.1) 100%);
            border-radius: 12px;
        }

        .preview-content img,
        .preview-content video,
        .preview-content canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
        }

        .preview-placeholder {
            text-align: center;
            color: var(--text-secondary);
        }

        .preview-placeholder svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-text {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 12px;
        }

        .status-text.success {
            color: var(--success);
        }

        .status-text.error {
            color: var(--danger);
        }

        /* Action Buttons */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-action {
            padding: 10px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-action:hover {
            background: rgba(59, 130, 246, 0.2);
            transform: translateY(-2px);
        }

        .btn-action:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* History */
        .history-section {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
        }

        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 12px;
        }

        .history-item {
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            position: relative;
        }

        .history-item img,
        .history-item video,
        .history-item canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .history-item:hover {
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .history-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
            font-size: 13px;
        }

        /* Info Box */
        .info-box {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid var(--success);
            border-radius: 8px;
            padding: 12px;
            font-size: 12px;
            color: var(--success);
            margin-top: 12px;
        }

        .info-box.error {
            background: rgba(239, 68, 68, 0.1);
            border-color: var(--danger);
            color: var(--danger);
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
                gap: 15px;
            }

            .panel-section {
                padding: 16px;
            }

            .preview-container {
                aspect-ratio: 16/9;
            }

            .button-group {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="mesh-background"></div>

    <div class="header">
        <div class="header-content">
            <div class="logo">✨ CreatorAI Studio</div>
            <div class="status-badge">
                <div class="status-dot"></div>
                API Ativa
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Painel de Controle -->
        <div class="control-panel">
            <!-- Modo -->
            <div class="panel-section">
                <div class="section-title">Modo de Criação</div>
                <div class="button-group" style="grid-template-columns: 1fr 1fr; gap: 8px;">
                    <button id="modeImage" class="btn-secondary" style="background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%); color: white; border: none;">🖼️ Imagem</button>
                    <button id="modeVideo" class="btn-secondary">🎬 Vídeo</button>
                </div>
            </div>

            <!-- Prompt -->
            <div class="panel-section">
                <div class="section-title">Seu Prompt</div>
                <textarea id="promptInput" placeholder="Descreva sua visão em detalhes. Ex: Uma cyborg guerreira com armadura de cristal, iluminação cinematográfica, ultra realista, 8K..."></textarea>
                <button id="surpriseBtn" class="btn-surprise" style="margin-top: 12px;">🎲 ME SURPREENDA</button>
            </div>

            <!-- Configurações -->
            <div class="panel-section">
                <div class="section-title">Configurações</div>
                <label style="display: block; margin-bottom: 12px; font-size: 12px; color: var(--text-secondary);">Proporção</label>
                <select id="ratioSelect">
                    <option value="1:1">1:1 (Quadrado)</option>
                    <option value="16:9" selected>16:9 (Widescreen)</option>
                    <option value="9:16">9:16 (Reels/TikTok)</option>
                    <option value="4:5">4:5 (Instagram)</option>
                </select>

                <label style="display: block; margin-top: 12px; margin-bottom: 12px; font-size: 12px; color: var(--text-secondary);">Estilo</label>
                <select id="styleSelect">
                    <option value="cinematographic">Cinematográfico</option>
                    <option value="photorealistic">Fotorrealista</option>
                    <option value="digital-art">Arte Digital</option>
                    <option value="anime">Anime</option>
                    <option value="cyberpunk">Cyberpunk</option>
                    <option value="3d-render">3D Render</option>
                </select>

                <button id="generateBtn" class="btn-primary" style="margin-top: 16px;">⚡ GERAR AGORA</button>
                <div class="info-box">
                    ✓ Geração 100% local - Ilimitada e grátis
                </div>
            </div>
        </div>

        <!-- Painel de Preview -->
        <div class="preview-panel">
            <div class="preview-container">
                <div class="preview-content" id="previewContent">
                    <div class="preview-placeholder">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                        <p>Sua obra-prima aparecerá aqui</p>
                        <p class="status-text">Clique em "Gerar Agora" para começar</p>
                    </div>
                </div>
            </div>

            <!-- Botões de Ação -->
            <div class="action-buttons">
                <button id="downloadBtn" class="btn-action" disabled>⬇️ BAIXAR</button>
                <button id="copyPromptBtn" class="btn-action" disabled>📋 COPIAR</button>
            </div>

            <!-- Histórico -->
            <div class="history-section">
                <div class="section-title">Histórico</div>
                <div class="history-grid" id="historyGrid">
                    <div class="history-empty">Nenhuma criação ainda</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Estado da aplicação
        let appState = {
            mode: 'image',
            currentPrompt: '',
            currentStyle: 'cinematographic',
            currentRatio: '16:9',
            currentImage: null,
            currentVideo: null,
            history: JSON.parse(localStorage.getItem('creatorai_history')) || [],
            isGenerating: false
        };

        // Elementos do DOM
        const elements = {
            modeImage: document.getElementById('modeImage'),
            modeVideo: document.getElementById('modeVideo'),
            promptInput: document.getElementById('promptInput'),
            surpriseBtn: document.getElementById('surpriseBtn'),
            ratioSelect: document.getElementById('ratioSelect'),
            styleSelect: document.getElementById('styleSelect'),
            generateBtn: document.getElementById('generateBtn'),
            downloadBtn: document.getElementById('downloadBtn'),
            copyPromptBtn: document.getElementById('copyPromptBtn'),
            previewContent: document.getElementById('previewContent'),
            historyGrid: document.getElementById('historyGrid')
        };

        // Prompts para "Me Surpreenda"
        const surprisePrompts = [
            "Uma cyborg guerreira com armadura de cristal, iluminação dramática, ultra detalhado, cinematográfico 8K",
            "Floresta alienígena com árvores bioluminescentes, três luas no céu, surrealismo digital, fotorrealista",
            "Cidade futurista em Marte com arquitetura neon, chuva de plasma, cinematográfico, ultra realista",
            "Dragão de fogo épico voando sobre montanhas, céu tempestuoso, arte digital, estilo anime",
            "Mulher cyberpunk com cabelo holográfico, neon rosa e azul, fotorrealista, ultra detalhado",
            "Castelo flutuante nas nuvens, luz dourada, fantasia épica, cinematográfico",
            "Robô samurai em combate, efeitos de luz neon, cyberpunk, 8K ultra realista",
            "Oceano cristalino com criaturas marinhas luminescentes, surrealismo, arte digital"
        ];

        // Mapeamento de dimensões
        const ratioMap = {
            '1:1': { width: 512, height: 512 },
            '16:9': { width: 768, height: 432 },
            '9:16': { width: 432, height: 768 },
            '4:5': { width: 512, height: 640 }
        };

        // Event Listeners
        elements.modeImage.addEventListener('click', () => setMode('image'));
        elements.modeVideo.addEventListener('click', () => setMode('video'));
        elements.surpriseBtn.addEventListener('click', surprisePrompt);
        elements.generateBtn.addEventListener('click', generateContent);
        elements.downloadBtn.addEventListener('click', downloadContent);
        elements.copyPromptBtn.addEventListener('click', copyPrompt);

        // Funções
        function setMode(mode) {
            appState.mode = mode;
            if (mode === 'image') {
                elements.modeImage.style.cssText = 'background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%); color: white; border: none;';
                elements.modeVideo.style.cssText = 'background: rgba(59, 130, 246, 0.1); color: var(--accent); border: 1px solid var(--accent);';
            } else {
                elements.modeImage.style.cssText = 'background: rgba(59, 130, 246, 0.1); color: var(--accent); border: 1px solid var(--accent);';
                elements.modeVideo.style.cssText = 'background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%); color: white; border: none;';
            }
        }

        function surprisePrompt() {
            const randomPrompt = surprisePrompts[Math.floor(Math.random() * surprisePrompts.length)];
            elements.promptInput.value = randomPrompt;
            elements.promptInput.focus();
        }

        // Gerador de imagem procedural baseado em hash do prompt
        function generateProceduralImage(prompt, width, height, style) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            // Seed baseado no prompt
            let hash = 0;
            for (let i = 0; i < prompt.length; i++) {
                const char = prompt.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }

            const seed = Math.abs(hash);
            const random = (n) => {
                const x = Math.sin(seed + n) * 10000;
                return x - Math.floor(x);
            };

            // Cores baseadas no estilo
            const colorPalettes = {
                cinematographic: ['#1a1a2e', '#16213e', '#0f3460', '#e94560', '#ff6b6b'],
                photorealistic: ['#8b7355', '#d4a574', '#f5deb3', '#cd853f', '#daa520'],
                'digital-art': ['#ff006e', '#fb5607', '#ffbe0b', '#8338ec', '#3a86ff'],
                anime: ['#ff1493', '#ff69b4', '#ffc0cb', '#ffb6c1', '#fff0f5'],
                cyberpunk: ['#00ff00', '#ff00ff', '#00ffff', '#0000ff', '#ff0000'],
                '3d-render': ['#c0c0c0', '#808080', '#a9a9a9', '#d3d3d3', '#696969']
            };

            const colors = colorPalettes[style] || colorPalettes.cinematographic;

            // Fundo gradiente
            const gradient = ctx.createLinearGradient(0, 0, width, height);
            gradient.addColorStop(0, colors[0]);
            gradient.addColorStop(1, colors[1]);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // Formas geométricas procedurais
            for (let i = 0; i < 20; i++) {
                ctx.fillStyle = colors[Math.floor(random(i * 100) * colors.length)];
                ctx.globalAlpha = random(i * 50) * 0.5;

                const x = random(i * 10) * width;
                const y = random(i * 20) * height;
                const size = random(i * 30) * 200;
                const shapeType = Math.floor(random(i * 40) * 3);

                if (shapeType === 0) {
                    ctx.fillRect(x, y, size, size);
                } else if (shapeType === 1) {
                    ctx.beginPath();
                    ctx.arc(x, y, size / 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x + size, y + size / 2);
                    ctx.lineTo(x, y + size);
                    ctx.closePath();
                    ctx.fill();
                }
            }

            ctx.globalAlpha = 1;

            // Efeitos de luz
            for (let i = 0; i < 5; i++) {
                const lightGradient = ctx.createRadialGradient(
                    random(i * 60) * width, random(i * 70) * height, 0,
                    random(i * 80) * width, random(i * 90) * height, 200
                );
                lightGradient.addColorStop(0, `rgba(255, 255, 255, ${random(i * 100) * 0.3})`);
                lightGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = lightGradient;
                ctx.fillRect(0, 0, width, height);
            }

            // Texto com o prompt
            ctx.fillStyle = colors[colors.length - 1];
            ctx.font = `bold 16px Arial`;
            ctx.globalAlpha = 0.7;
            const text = prompt.substring(0, 50) + (prompt.length > 50 ? '...' : '');
            ctx.fillText(text, 20, height - 20);
            ctx.globalAlpha = 1;

            return canvas;
        }

        async function generateContent() {
            const prompt = elements.promptInput.value.trim();
            if (!prompt) {
                showError('Por favor, digite um prompt');
                return;
            }

            appState.isGenerating = true;
            elements.generateBtn.disabled = true;
            showLoading();

            try {
                const ratio = elements.ratioSelect.value;
                const dims = ratioMap[ratio];
                const style = elements.styleSelect.value;

                if (appState.mode === 'image') {
                    await displayImage(prompt, dims, style);
                } else {
                    await generateVideo(prompt, dims, style);
                }

                // Adicionar ao histórico
                addToHistory(appState.currentImage || appState.currentVideo, appState.mode);

            } catch (error) {
                showError('Erro ao gerar conteúdo: ' + error.message);
            } finally {
                appState.isGenerating = false;
                elements.generateBtn.disabled = false;
            }
        }

        async function displayImage(prompt, dims, style) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    const canvas = generateProceduralImage(prompt, dims.width, dims.height, style);
                    appState.currentImage = canvas.toDataURL('image/png');
                    appState.currentPrompt = prompt;
                    
                    elements.previewContent.innerHTML = '';
                    elements.previewContent.appendChild(canvas);
                    
                    elements.downloadBtn.disabled = false;
                    elements.copyPromptBtn.disabled = false;
                    showSuccess('✓ Imagem gerada com sucesso!');
                    resolve();
                }, 500);
            });
        }

        async function generateVideo(prompt, dims, style) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    const canvas = document.createElement('canvas');
                    canvas.width = dims.width;
                    canvas.height = dims.height;
                    const ctx = canvas.getContext('2d');

                    const frames = [];
                    const duration = 5000;
                    const fps = 30;
                    const totalFrames = Math.floor((duration / 1000) * fps);

                    // Renderizar frames com efeito de zoom
                    for (let i = 0; i < totalFrames; i++) {
                        const progress = i / totalFrames;
                        const scale = 1 + progress * 0.2;

                        const frameCanvas = generateProceduralImage(prompt + ` frame ${i}`, dims.width, dims.height, style);
                        ctx.save();
                        ctx.translate(dims.width / 2, dims.height / 2);
                        ctx.scale(scale, scale);
                        ctx.translate(-dims.width / 2, -dims.height / 2);
                        ctx.drawImage(frameCanvas, 0, 0);
                        ctx.restore();

                        frames.push(canvas.toDataURL('image/webp'));
                    }

                    const canvas2 = document.createElement('canvas');
                    canvas2.width = dims.width;
                    canvas2.height = dims.height;
                    const ctx2 = canvas2.getContext('2d');

                    const mediaRecorder = new MediaRecorder(canvas2.captureStream(fps), { mimeType: 'video/webm' });
                    const chunks = [];

                    mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'video/webm' });
                        const videoUrl = URL.createObjectURL(blob);
                        appState.currentVideo = videoUrl;
                        appState.currentPrompt = prompt;

                        const video = document.createElement('video');
                        video.src = videoUrl;
                        video.controls = true;
                        video.autoplay = true;
                        video.loop = true;
                        elements.previewContent.innerHTML = '';
                        elements.previewContent.appendChild(video);

                        elements.downloadBtn.disabled = false;
                        elements.copyPromptBtn.disabled = false;
                        showSuccess('✓ Vídeo gerado com sucesso!');
                        resolve();
                    };

                    mediaRecorder.start();

                    let frameIndex = 0;
                    const renderFrame = () => {
                        if (frameIndex < frames.length) {
                            const frameImg = new Image();
                            frameImg.onload = () => {
                                ctx2.drawImage(frameImg, 0, 0);
                                frameIndex++;
                                setTimeout(renderFrame, 1000 / fps);
                            };
                            frameImg.src = frames[frameIndex];
                        } else {
                            mediaRecorder.stop();
                        }
                    };

                    renderFrame();
                }, 500);
            });
        }

        function downloadContent() {
            if (appState.mode === 'image' && appState.currentImage) {
                const a = document.createElement('a');
                a.href = appState.currentImage;
                a.download = `creatorai-${Date.now()}.png`;
                a.click();
            } else if (appState.mode === 'video' && appState.currentVideo) {
                const a = document.createElement('a');
                a.href = appState.currentVideo;
                a.download = `creatorai-${Date.now()}.webm`;
                a.click();
            }
        }

        function copyPrompt() {
            navigator.clipboard.writeText(appState.currentPrompt);
            showSuccess('✓ Prompt copiado!');
        }

        function addToHistory(content, type) {
            appState.history.unshift({ content, type, timestamp: Date.now() });
            if (appState.history.length > 12) appState.history.pop();
            localStorage.setItem('creatorai_history', JSON.stringify(appState.history));
            renderHistory();
        }

        function renderHistory() {
            if (appState.history.length === 0) {
                elements.historyGrid.innerHTML = '<div class="history-empty">Nenhuma criação ainda</div>';
                return;
            }

            elements.historyGrid.innerHTML = appState.history.map((item, index) => {
                if (item.type === 'image') {
                    return `<div class="history-item" onclick="restoreFromHistory(${index})"><img src="${item.content}" alt="History"></div>`;
                } else {
                    return `<div class="history-item" onclick="restoreFromHistory(${index})"><video src="${item.content}" style="width:100%;height:100%;object-fit:cover;"></video></div>`;
                }
            }).join('');
        }

        function restoreFromHistory(index) {
            const item = appState.history[index];
            if (item.type === 'image') {
                setMode('image');
                appState.currentImage = item.content;
                const img = document.createElement('img');
                img.src = item.content;
                elements.previewContent.innerHTML = '';
                elements.previewContent.appendChild(img);
            } else {
                setMode('video');
                appState.currentVideo = item.content;
                const video = document.createElement('video');
                video.src = item.content;
                video.controls = true;
                video.autoplay = true;
                video.loop = true;
                elements.previewContent.innerHTML = '';
                elements.previewContent.appendChild(video);
            }
            elements.downloadBtn.disabled = false;
            elements.copyPromptBtn.disabled = false;
        }

        function showLoading() {
            elements.previewContent.innerHTML = '<div class="loading-spinner"></div><p class="status-text" style="margin-top: 16px;">Gerando sua criação...</p>';
        }

        function showSuccess(message) {
            const statusEl = document.createElement('p');
            statusEl.className = 'status-text success';
            statusEl.textContent = message;
            statusEl.style.position = 'fixed';
            statusEl.style.bottom = '20px';
            statusEl.style.right = '20px';
            statusEl.style.zIndex = '1000';
            statusEl.style.background = 'rgba(16, 185, 129, 0.1)';
            statusEl.style.border = '1px solid var(--success)';
            statusEl.style.padding = '12px 16px';
            statusEl.style.borderRadius = '8px';
            document.body.appendChild(statusEl);
            setTimeout(() => statusEl.remove(), 3000);
        }

        function showError(message) {
            const statusEl = document.createElement('p');
            statusEl.className = 'status-text error';
            statusEl.textContent = '✗ ' + message;
            statusEl.style.position = 'fixed';
            statusEl.style.bottom = '20px';
            statusEl.style.right = '20px';
            statusEl.style.zIndex = '1000';
            statusEl.style.background = 'rgba(239, 68, 68, 0.1)';
            statusEl.style.border = '1px solid var(--danger)';
            statusEl.style.padding = '12px 16px';
            statusEl.style.borderRadius = '8px';
            document.body.appendChild(statusEl);
            setTimeout(() => statusEl.remove(), 3000);
        }

        // Inicializar
        renderHistory();
    </script>
</body>
</html>
