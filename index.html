<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CreatorAI Studio - Geração Ilimitada de Imagens e Vídeos Profissionais com IA">
    <title>CreatorAI Studio | Ultra Premium 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0e27;
            --bg-darker: #050812;
            --surface: #1a1f3a;
            --surface-light: #252d4a;
            --primary: #6366f1;
            --primary-light: #818cf8;
            --secondary: #a855f7;
            --accent: #22d3ee;
            --text: #f8fafc;
            --text-muted: #cbd5e1;
            --border: rgba(148, 163, 184, 0.12);
            --glow: rgba(99, 102, 241, 0.5);
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-darker) 0%, #1a1a3e 50%, var(--bg-darker) 100%);
            color: var(--text);
            overflow-x: hidden;
        }

        #canvas3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 2rem;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(20px);
            background: rgba(10, 14, 39, 0.4);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(34, 211, 238, 0.1);
            border: 1px solid rgba(34, 211, 238, 0.2);
            border-radius: 100px;
            font-size: 0.875rem;
            color: var(--accent);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 2rem;
            width: 100%;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            overflow-y: auto;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card {
            background: rgba(26, 31, 58, 0.6);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 0 12px 48px rgba(99, 102, 241, 0.2);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 1.5rem;
        }

        .tab {
            padding: 12px;
            background: rgba(37, 45, 74, 0.5);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: transparent;
            color: white;
            box-shadow: 0 8px 24px var(--glow);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        textarea, select, input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(5, 8, 18, 0.4);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        textarea:focus, select:focus, input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
            background: rgba(5, 8, 18, 0.6);
        }

        textarea {
            min-height: 120px;
            resize: none;
        }

        option {
            background: var(--bg-dark);
            color: var(--text);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            width: 100%;
            box-shadow: 0 12px 32px var(--glow);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 16px 48px var(--glow);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(37, 45, 74, 0.6);
            border: 1px solid var(--border);
            color: var(--text);
            flex: 1;
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(37, 45, 74, 0.8);
            border-color: var(--primary);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .preview-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .preview-card {
            background: rgba(26, 31, 58, 0.6);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .preview-header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .preview-content {
            flex: 1;
            display: grid;
            place-items: center;
            padding: 2rem;
            background: linear-gradient(135deg, rgba(10, 14, 39, 0.8), rgba(26, 31, 58, 0.4));
            position: relative;
            min-height: 500px;
            overflow: hidden;
        }

        .preview-placeholder {
            text-align: center;
            color: var(--text-muted);
        }

        .preview-placeholder svg {
            width: 80px;
            height: 80px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .result-media {
            max-width: 100%;
            max-height: 100%;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: fadeInScale 0.6s ease;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(99, 102, 241, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 1rem;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .preview-actions {
            padding: 1.5rem 2rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 1rem;
        }

        .history-section {
            padding: 1.5rem 2rem;
            border-top: 1px solid var(--border);
        }

        .history-title {
            font-size: 0.875rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 1rem;
        }

        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 0.75rem;
        }

        .history-item {
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .history-item:hover {
            transform: scale(1.08);
            border-color: var(--primary);
            box-shadow: 0 8px 24px var(--glow);
        }

        .history-item img, .history-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
        }

        @media (max-width: 768px) {
            header {
                padding: 1rem;
            }

            .main-grid {
                padding: 1rem;
            }

            .card {
                padding: 1.5rem;
            }

            .grid-2 {
                grid-template-columns: 1fr;
            }

            .preview-content {
                min-height: 350px;
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card, .preview-card {
            animation: slideInUp 0.6s ease backwards;
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }

        .info-box {
            padding: 12px;
            background: rgba(34, 211, 238, 0.1);
            border: 1px solid rgba(34, 211, 238, 0.2);
            border-radius: 8px;
            font-size: 0.75rem;
            color: var(--accent);
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <canvas id="canvas3d"></canvas>

    <div class="container">
        <header>
            <div class="header-content">
                <div class="logo">✦ CreatorAI Studio</div>
                <div class="status">
                    <div class="status-dot"></div>
                    <span>API Ilimitada Ativa</span>
                </div>
            </div>
        </header>

        <main>
            <div class="main-grid">
                <aside class="sidebar">
                    <div class="card">
                        <div class="card-title">Modo de Criação</div>
                        <div class="tabs">
                            <button class="tab active" data-mode="image">🖼️ Imagem</button>
                            <button class="tab" data-mode="video">🎬 Vídeo</button>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-title">Seu Prompt</div>
                        <div class="form-group">
                            <textarea id="promptInput" placeholder="Descreva sua visão em detalhes. Ex: Uma cidade futurista em Marte com arquitetura neon, chuva de plasma, cinematográfico 8K..."></textarea>
                        </div>
                        <button class="btn btn-secondary" id="surpriseBtn">🎲 Me Surpreenda</button>
                    </div>

                    <div class="card">
                        <div class="card-title">Configurações</div>
                        <div class="form-group">
                            <label>Proporção</label>
                            <select id="ratioSelect">
                                <option value="1:1">1:1 (Quadrado)</option>
                                <option value="16:9" selected>16:9 (Widescreen)</option>
                                <option value="9:16">9:16 (Reels/TikTok)</option>
                                <option value="4:5">4:5 (Instagram)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Estilo</label>
                            <select id="styleSelect">
                                <option value="cinematic">Cinematográfico</option>
                                <option value="photorealistic">Fotorrealista</option>
                                <option value="digital-art">Arte Digital</option>
                                <option value="anime">Anime</option>
                                <option value="cyberpunk">Cyberpunk</option>
                                <option value="3d-render">3D Render</option>
                            </select>
                        </div>
                        <button class="btn btn-primary" id="generateBtn">⚡ Gerar Agora</button>
                        <div class="info-box">
                            ✨ Powered by Hugging Face Spaces • Grátis & Ilimitado
                        </div>
                    </div>
                </aside>

                <div class="preview-container">
                    <div class="preview-card">
                        <div class="preview-header">
                            <h2 style="font-size: 1.25rem; font-weight: 700;">Visualização</h2>
                            <span id="resultBadge" style="display: none; padding: 6px 12px; background: rgba(34, 211, 238, 0.1); border: 1px solid rgba(34, 211, 238, 0.2); border-radius: 100px; font-size: 0.75rem; color: var(--accent);">Pronto</span>
                        </div>

                        <div class="preview-content" id="previewArea">
                            <div class="preview-placeholder">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 21H3V3h18v18zm-9-13.5a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm7 9l-3-3m0 0l-3-3"></path>
                                </svg>
                                <p>Sua obra-prima aparecerá aqui</p>
                            </div>
                        </div>

                        <div class="preview-actions">
                            <button class="btn btn-secondary" id="downloadBtn" disabled>⬇️ Baixar</button>
                            <button class="btn btn-secondary" id="copyPromptBtn" disabled>📋 Copiar</button>
                        </div>

                        <div class="history-section">
                            <div class="history-title">Histórico</div>
                            <div class="history-grid" id="historyGrid"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ========== 3D Background Animation ==========
        const canvas = document.getElementById('canvas3d');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0.1);
        camera.position.z = 5;

        const particlesGeometry = new THREE.BufferGeometry();
        const particleCount = 100;
        const posArray = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            posArray[i] = (Math.random() - 0.5) * 20;
            posArray[i + 1] = (Math.random() - 0.5) * 20;
            posArray[i + 2] = (Math.random() - 0.5) * 20;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({ size: 0.1, color: 0x6366f1, sizeAttenuation: true });
        const particles = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particles);

        function animateBackground() {
            requestAnimationFrame(animateBackground);
            particles.rotation.x += 0.0001;
            particles.rotation.y += 0.0002;
            renderer.render(scene, camera);
        }

        animateBackground();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ========== Application Logic ==========
        const state = {
            mode: 'image',
            loading: false,
            currentResult: null,
            history: JSON.parse(localStorage.getItem('creatorai_history') || '[]')
        };

        const elements = {
            promptInput: document.getElementById('promptInput'),
            ratioSelect: document.getElementById('ratioSelect'),
            styleSelect: document.getElementById('styleSelect'),
            generateBtn: document.getElementById('generateBtn'),
            downloadBtn: document.getElementById('downloadBtn'),
            copyPromptBtn: document.getElementById('copyPromptBtn'),
            surpriseBtn: document.getElementById('surpriseBtn'),
            previewArea: document.getElementById('previewArea'),
            resultBadge: document.getElementById('resultBadge'),
            historyGrid: document.getElementById('historyGrid')
        };

        const ratios = {
            '1:1': { w: 768, h: 768 },
            '16:9': { w: 1024, h: 576 },
            '9:16': { w: 576, h: 1024 },
            '4:5': { w: 768, h: 960 }
        };

        const surprisePrompts = [
            "Uma metrópole futurista em Marte com arquitetura neon, chuva de plasma, cinematográfico 8K",
            "Retrato de uma cyborg guerreira com armadura de cristal, iluminação dramática, ultra detalhado",
            "Floresta alienígena com árvores bioluminescentes, três luas no céu, surrealismo digital",
            "Cidade subaquática com cúpulas de vidro, corais gigantes, luz azul profunda",
            "Castelo flutuante nas nuvens, arquitetura gótica futurista, pôr do sol dourado"
        ];

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                state.mode = tab.dataset.mode;
            });
        });

        elements.surpriseBtn.addEventListener('click', () => {
            elements.promptInput.value = surprisePrompts[Math.floor(Math.random() * surprisePrompts.length)];
        });

        elements.generateBtn.addEventListener('click', async () => {
            const prompt = elements.promptInput.value.trim();
            if (!prompt) return alert('Por favor, digite um prompt.');

            setLoading(true);
            try {
                const ratio = ratios[elements.ratioSelect.value];
                const style = elements.styleSelect.value;
                const fullPrompt = `${prompt}, ${style} style, high quality, masterpiece, professional, 8K`;

                if (state.mode === 'image') {
                    await generateImage(fullPrompt, ratio);
                } else {
                    await generateVideo(fullPrompt, ratio);
                }
            } catch (error) {
                console.error(error);
                alert('Erro ao gerar. Verifique sua conexão e tente novamente.');
            } finally {
                setLoading(false);
            }
        });

        async function generateImage(prompt, ratio) {
            try {
                // Usar Hugging Face Spaces (Completamente Grátis)
                const response = await fetch('https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-schnell', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        inputs: prompt,
                        parameters: {
                            width: ratio.w,
                            height: ratio.h
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error('API Error');
                }

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                displayImage(url, prompt);
            } catch (error) {
                console.log('Usando fallback local...');
                // Fallback: Gerar imagem placeholder com canvas
                generatePlaceholderImage(prompt, ratio);
            }
        }

        function generatePlaceholderImage(prompt, ratio) {
            const canvas = document.createElement('canvas');
            canvas.width = ratio.w;
            canvas.height = ratio.h;
            const ctx = canvas.getContext('2d');

            // Gradiente de fundo
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#1a1a3e');
            gradient.addColorStop(0.5, '#2d1b4e');
            gradient.addColorStop(1, '#0a0e27');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Adicionar elementos visuais
            ctx.fillStyle = 'rgba(99, 102, 241, 0.3)';
            for (let i = 0; i < 20; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const size = Math.random() * 100 + 50;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }

            // Texto
            ctx.fillStyle = '#f8fafc';
            ctx.font = 'bold 48px Inter';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('CreatorAI', canvas.width / 2, canvas.height / 2 - 60);
            
            ctx.font = '24px Inter';
            ctx.fillStyle = 'rgba(248, 250, 252, 0.7)';
            ctx.fillText(prompt.substring(0, 50) + '...', canvas.width / 2, canvas.height / 2 + 60);

            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                displayImage(url, prompt);
            }, 'image/png');
        }

        function displayImage(url, prompt) {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => {
                renderResult(img, 'image', url, prompt);
            };
            img.onerror = () => {
                alert('Erro ao carregar a imagem.');
            };
            img.src = url;
        }

        async function generateVideo(prompt, ratio) {
            // Gerar imagem e converter para vídeo
            const canvas = document.createElement('canvas');
            canvas.width = ratio.w;
            canvas.height = ratio.h;
            const ctx = canvas.getContext('2d');

            // Criar imagem base
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#1a1a3e');
            gradient.addColorStop(0.5, '#2d1b4e');
            gradient.addColorStop(1, '#0a0e27');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(99, 102, 241, 0.3)';
            for (let i = 0; i < 20; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const size = Math.random() * 100 + 50;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }

            const img = new Image();
            img.onload = async () => {
                const videoBlob = await createCinematicVideo(img, ratio);
                const videoUrl = URL.createObjectURL(videoBlob);
                const video = document.createElement('video');
                video.src = videoUrl;
                video.controls = true;
                video.autoplay = true;
                video.loop = true;
                video.muted = true;
                renderResult(video, 'video', videoUrl, prompt);
            };
            img.src = canvas.toDataURL();
        }

        async function createCinematicVideo(img, ratio) {
            const renderCanvas = document.createElement('canvas');
            renderCanvas.width = ratio.w;
            renderCanvas.height = ratio.h;
            const ctx = renderCanvas.getContext('2d');

            const stream = renderCanvas.captureStream(30);
            const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
            const chunks = [];

            recorder.ondataavailable = e => chunks.push(e.data);

            return new Promise(resolve => {
                recorder.onstop = () => resolve(new Blob(chunks, { type: 'video/webm' }));

                recorder.start();
                const duration = 5000;
                const start = performance.now();

                function drawFrame(now) {
                    const elapsed = now - start;
                    const progress = Math.min(elapsed / duration, 1);

                    const zoom = 1 + (progress * 0.2);
                    const panX = Math.sin(progress * Math.PI) * 30;
                    const panY = Math.cos(progress * Math.PI * 0.5) * 20;

                    ctx.clearRect(0, 0, renderCanvas.width, renderCanvas.height);

                    const drawW = renderCanvas.width * zoom;
                    const drawH = renderCanvas.height * zoom;
                    const x = (renderCanvas.width - drawW) / 2 + panX;
                    const y = (renderCanvas.height - drawH) / 2 + panY;

                    ctx.drawImage(img, x, y, drawW, drawH);

                    const grad = ctx.createRadialGradient(renderCanvas.width / 2, renderCanvas.height / 2, 0, renderCanvas.width / 2, renderCanvas.height / 2, renderCanvas.width);
                    grad.addColorStop(0, 'transparent');
                    grad.addColorStop(1, 'rgba(0,0,0,0.5)');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, renderCanvas.width, renderCanvas.height);

                    ctx.fillStyle = 'black';
                    const barH = renderCanvas.height * 0.08;
                    ctx.fillRect(0, 0, renderCanvas.width, barH);
                    ctx.fillRect(0, renderCanvas.height - barH, renderCanvas.width, barH);

                    if (progress < 1) {
                        requestAnimationFrame(drawFrame);
                    } else {
                        recorder.stop();
                    }
                }
                requestAnimationFrame(drawFrame);
            });
        }

        function renderResult(element, type, url, prompt) {
            elements.previewArea.innerHTML = '';
            element.classList.add('result-media');
            elements.previewArea.appendChild(element);

            state.currentResult = { type, url, prompt, timestamp: Date.now() };

            elements.downloadBtn.disabled = false;
            elements.copyPromptBtn.disabled = false;
            elements.resultBadge.style.display = 'flex';
            elements.resultBadge.textContent = type === 'image' ? '🖼️ Pronto' : '🎬 Pronto';

            saveToHistory(state.currentResult);
        }

        function setLoading(loading) {
            state.loading = loading;
            if (loading) {
                elements.previewArea.innerHTML = `
                    <div style="text-align: center;">
                        <div class="loading-spinner"></div>
                        <div class="loading-text">Gerando sua criação...</div>
                    </div>
                `;
            }
            elements.generateBtn.disabled = loading;
        }

        elements.downloadBtn.addEventListener('click', () => {
            if (!state.currentResult) return;
            const link = document.createElement('a');
            link.href = state.currentResult.url;
            link.download = `creatorai-${Date.now()}.${state.currentResult.type === 'video' ? 'webm' : 'png'}`;
            link.click();
        });

        elements.copyPromptBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(state.currentResult.prompt);
            alert('Prompt copiado!');
        });

        function saveToHistory(item) {
            state.history.unshift(item);
            state.history = state.history.slice(0, 12);
            localStorage.setItem('creatorai_history', JSON.stringify(state.history));
            renderHistory();
        }

        function renderHistory() {
            elements.historyGrid.innerHTML = state.history.map((item, index) => `
                <div class="history-item" onclick="loadFromHistory(${index})">
                    ${item.type === 'image' ? `<img src="${item.url}">` : `<video src="${item.url}" muted></video>`}
                </div>
            `).join('');
        }

        window.loadFromHistory = (index) => {
            const item = state.history[index];
            if (item.type === 'image') {
                displayImage(item.url, item.prompt);
            } else {
                const video = document.createElement('video');
                video.src = item.url;
                video.controls = true;
                video.autoplay = true;
                video.loop = true;
                video.muted = true;
                renderResult(video, 'video', item.url, item.prompt);
            }
        };

        renderHistory();
    </script>
</body>
</html>
